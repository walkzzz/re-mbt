name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Update registry
        run: moon update
      - name: Check (deny warnings)
        run: moon check --deny-warn
      - name: Test (all supported backends)
        run: |
          for t in native wasm wasm-gc js; do
            echo "== target: $t =="
            moon test --target $t
          done
      - name: Build
        run: moon build
