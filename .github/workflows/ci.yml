name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  MOONBIT_VERSION: latest

jobs:
  quality:
    name: fmt / check / .mbti / docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: moon fmt --check
        run: moon fmt --check
      - name: moon check --deny-warn --target all（latest 下屏蔽 deprecated 0020，见 known-gaps）
        run: moon check --deny-warn --target all --warn-list -0020
      - name: .mbti contract drift
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Docs consistency
        run: node scripts/check_docs.mjs
      - name: Pages demo self-check (assets / JS exports / match semantics)
        run: node scripts/check_pages.mjs

  test:
    name: moon test --target ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: moon test --target ${{ matrix.target }}
        run: moon test --target ${{ matrix.target }}

  coverage:
    name: coverage gate (core >= 95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: Coverage gate
        run: node scripts/check_coverage.mjs

  examples:
    name: runnable example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: Run demo
        run: moon run examples/demo --target native

  bench:
    name: bench smoke (native release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: Run benchmarks
        run: moon run bench/main --target native --release

  mutation:
    name: mutation testing (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: Mutation testing (mbtx, 学 agentskills/gbz185)
        run: moon run scripts/mutation_test.mbtx